version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "www-data" 
    container_name: php-app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    expose:
      - "9000"

  nginx:
    image: nginx:alpine
    container_name: nginx-web
    restart: always
    ports:
      - "1817:80"
    volumes:
      - ./public:/var/www/html/public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app