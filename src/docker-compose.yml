version: '3.8'

services:
  # Servicio de la aplicación PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Usamos php-fpm como usuario para mayor seguridad
    user: "www-data" 
    container_name: php-app
    restart: always
    working_dir: /var/www/html
    volumes:
      # Monta tu código en el contenedor para que los cambios se reflejen al instante
      - ./:/var/www/html
    # El puerto por defecto de PHP-FPM
    expose:
      - "9000"

  # Servicio del servidor web Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx-web
    restart: always
    ports:
      # Mapea el puerto 80 del contenedor al puerto 8000 de tu máquina local
      - "8000:80"
    volumes:
      # Monta el archivo de configuración de Nginx que crearemos a continuación
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      # Asegura que la aplicación PHP esté lista antes de iniciar Nginx
      - app